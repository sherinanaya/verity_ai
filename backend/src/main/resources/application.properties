spring.application.name=verityai
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/verityai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.groq-api-key=${GROQ_API_KEY:}
app.groq-model=${GROQ_MODEL:openai/gpt-oss-20b}
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
